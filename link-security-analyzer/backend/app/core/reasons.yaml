# Verdict-level advice (shown at the top of the result)
advice:
  DANGEROUS:
    en: "Do not enter passwords, card details, or UPI PIN. Do not approve any payment. Contact the organization using the phone number on your card, passbook, or their official app."
    hindi: ""
    marathi: ""
  
  SUSPICIOUS:
    en: "Verify this link through an official channel (phone number on your card, official app, or website you typed yourself) before entering any information or making a payment."
    hindi: ""
    marathi: ""
  
  LIKELY_SAFE:
    en: "No warning signs found by the checks that ran. This is not a guarantee. If something feels wrong, verify through an official channel."
    hindi: ""
    marathi: ""
  
  UNKNOWN:
    en: "Not enough information to assess risk. Verify this link through an official channel before entering information or making a payment."
    hindi: ""
    marathi: ""

# Coverage messages (appended to LIKELY_SAFE when reduced coverage)
coverage_note:
  sandbox_unavailable:
    en: "The page itself could not be analyzed (browser sandbox unavailable or page unreachable). This verdict is based on the address and registration information only."
    hindi: ""
    marathi: ""
  
  no_external_reputation:
    en: "External reputation services (Google Safe Browsing, VirusTotal) were not available for this check."
    hindi: ""
    marathi: ""
  
  limited_checks:
