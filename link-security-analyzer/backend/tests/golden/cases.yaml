# Golden test set for Phase 8 scoring
# 60+ scenario cases with expected verdicts and score ranges
# Each case defines input signals and expected outputs

version: "1.0"
description: "Golden test cases for verdict engine"

cases:
  # === Benign cases ===
  - id: benign_big_site
    name: "Benign popular site (Google)"
    signals:
      - id: POPULARITY_TOP_10K
        evidence: {rank: 1}
    expected_verdict: LIKELY_SAFE
    expected_score_min: 0
    expected_score_max: 20
    expected_top_reason: POPULARITY_TOP_10K
    notes: "Top site with no risk signals"

  - id: benign_small_old_site
    name: "Benign small old domain"
    signals:
      - id: POPULARITY_TOP_100K
        evidence: {rank: 50000}
    domain_age_days: 3650  # 10 years
    expected_verdict: LIKELY_SAFE
    expected_score_min: 0
    expected_score_max: 15
    notes: "Old domain, moderate popularity"

  - id: new_legit_shop_with_gateway
    name: "New legitimate e-commerce with recognized gateway"
    signals:
      - id: DOMAIN_AGE_LT_30D
        evidence: {days: 25}
      - id: HAS_CARD_FIELDS
        evidence: {}
      - id: RECOGNIZED_GATEWAY
        evidence: {gateway_name: "Razorpay"}
    expected_verdict: LIKELY_SAFE
    expected_score_min: 0
    expected_score_max: 30
    expected_top_reason: DOMAIN_AGE_LT_30D
    notes: "Young domain but has payment gateway"

  - id: benign_login_page_official
    name: "Legitimate bank login page on official domain"
    signals:
      - id: HAS_PASSWORD_FIELD
        evidence: {}
      - id: BRAND_TEXT_DOMAIN_MISMATCH  # Should NOT fire on official domain
        evidence: {brand_name: "State Bank of India"}
    domain: "onlinesbi.sbi"
    expected_verdict: LIKELY_SAFE
    expected_score_min: 0
    expected_score_max: 10
    notes: "Official domain exemption should apply"

  # === Dangerous cases - blocklist hits ===
  - id: blocklist_url_hit
    name: "Exact URL on phishing blocklist"
    signals:
      - id: BLOCKLIST_URL_HIT
        evidence: {feed_name: "OpenPhish"}
    expected_verdict: DANGEROUS
    expected_score_min: 70
    expected_score_max: 100
    expected_top_reason: BLOCKLIST_URL_HIT
    notes: "Hard override to DANGEROUS"

  - id: gsb_threat
    name: "Google Safe Browsing threat"
    signals:
      - id: GSB_THREAT
        evidence: {threat_type: "SOCIAL_ENGINEERING"}
      - id: POPULARITY_TOP_10K  # Even popular -> DANGEROUS
        evidence: {rank: 5000}
    expected_verdict: DANGEROUS
    expected_score_min: 70
    expected_score_max: 100
    expected_top_reason: GSB_THREAT
    notes: "Hard override ignores popularity"

  - id: vt_malicious_ge3
    name: "VirusTotal 3+ vendors flag as malicious"
    signals:
      - id: VT_MALICIOUS_GE3
        evidence: {malicious_count: 5}
    expected_verdict: DANGEROUS
    expected_score_min: 70
    expected_score_max: 100
    expected_top_reason: VT_MALICIOUS_GE3
    notes: "Hard override"

  # === Dangerous cases - phishing patterns ===
  - id: fresh_typosquat
    name: "Fresh domain typosquatting SBI"
    signals:
      - id: TYPOSQUAT_BRAND
        evidence: {brand_name: "State Bank of India"}
      - id: DOMAIN_AGE_LT_7D
        evidence: {days: 2}
      - id: HAS_PASSWORD_FIELD
        evidence: {}
      - id: FORM_POSTS_CROSS_DOMAIN
        evidence: {target_domain: "evil.com"}
    expected_verdict: DANGEROUS
    expected_score_min: 85
    expected_score_max: 100
    expected_top_reason: TYPOSQUAT_BRAND
    notes: "Multiple high-severity signals"

  - id: brand_lookalike_credentials
    name: "Visual brand match + password field"
    signals:
      - id: VISUAL_BRAND_MATCH
        evidence: {brand_name: "HDFC Bank", distance: 6}
      - id: HAS_PASSWORD_FIELD
        evidence: {}
      - id: BRAND_LOOKALIKE_ON_FOREIGN_DOMAIN
        evidence: {brand_name: "HDFC Bank"}
      - id: DOMAIN_AGE_LT_30D
        evidence: {days: 15}
    expected_verdict: DANGEROUS
    expected_score_min: 90
    expected_score_max: 100
    expected_top_reason: BRAND_LOOKALIKE_ON_FOREIGN_DOMAIN
    notes: "Combination rule triggers"

  - id: shared_hosting_phishing
    name: "Phishing on shared hosting platform"
    signals:
      - id: TYPOSQUAT_BRAND
        evidence: {brand_name: "PayPal"}
      - id: HAS_PASSWORD_FIELD
        evidence: {}
      - id: SUSPICIOUS_TLD
        evidence: {tld: "tk"}
    domain: "paypal-verify.github.io"  # Shared hosting
    expected_verdict: DANGEROUS
    expected_score_min: 55
    expected_score_max: 75
    notes: "No popularity credit on shared hosting"

  - id: young_domain_card_fields_no_gateway
    name: "Young domain asking for card without gateway"
    signals:
      - id: DOMAIN_AGE_LT_7D
        evidence: {days: 3}
      - id: HAS_CARD_FIELDS
        evidence: {}
      - id: PAYMENT_WITHOUT_KNOWN_GATEWAY
        evidence: {}
      - id: CREDENTIAL_OR_PAYMENT_ON_YOUNG_DOMAIN
        evidence: {}
    expected_verdict: DANGEROUS
    expected_score_min: 75
    expected_score_max: 100
    expected_top_reason: DOMAIN_AGE_LT_7D
    notes: "Combination rules apply"

  # === Suspicious cases ===
  - id: suspicious_tld_young_domain
