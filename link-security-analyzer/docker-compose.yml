# TrueIntent Module A — local dev stack.
# Run from this folder: `docker compose up --build`
# Needs a `.env` file (copy `.env.example`) — never commit real keys.
name: trueintent

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trueintent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trueintent}
      POSTGRES_DB: ${POSTGRES_DB:-trueintent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trueintent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trueintent:trueintent@postgres:5432/trueintent}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg2://trueintent:trueintent@postgres:5432/trueintent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # Playwright image already runs as non-root `pwuser` (see Dockerfile.worker).
    user: "pwuser"
    # Chromium needs shared memory and room to breathe.
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trueintent:trueintent@postgres:5432/trueintent}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg2://trueintent:trueintent@postgres:5432/trueintent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend/app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Full celery healthcheck lands with app/workers/celery_app.py in Chunk 5.
    # For now, verify the worker image at least imports celery.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import celery; print(celery.__version__)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Placeholder until the Next.js UI lands in Chunk 8.
  frontend:
    image: node:20-alpine
    command: ["sleep", "infinity"]
    ports:
      - "3000:3000"

volumes:
  pgdata:
