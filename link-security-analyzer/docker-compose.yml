# TrueIntent Module A — local dev stack.
# Run from this folder: `docker compose up --build`
# Needs a `.env` file (copy `.env.example`) — never commit real keys.
name: trueintent

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trueintent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trueintent}
      POSTGRES_DB: ${POSTGRES_DB:-trueintent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trueintent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trueintent:trueintent@postgres:5432/trueintent}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg2://trueintent:trueintent@postgres:5432/trueintent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # Playwright image already runs as non-root `pwuser` (see Dockerfile.worker).
    user: "pwuser"
    # Chromium needs shared memory and room to breathe.
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trueintent:trueintent@postgres:5432/trueintent}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg2://trueintent:trueintent@postgres:5432/trueintent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Worker concurrency (1-2 for memory constraints)
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
    volumes:
      - ./backend/app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default  # Can access Postgres/Redis
      # Note: Browser traffic goes through netguard which blocks private IPs
      # Network-level isolation would require separate Docker network which
      # complicates the setup. We rely on netguard + container hardening instead.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
